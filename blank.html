var source=document.getElementById('source'),frame=document.getElementById('frame'),message=document.getElementById('message');function preview(){frame.srcdoc=source.value;frame.classList.remove('hidden');source.classList.add('hidden');}document.getElementById('preview').onclick=function(){if(source.classList.contains('hidden')){source.classList.remove('hidden');frame.classList.add('hidden');}else preview();};document.getElementById('download').onclick=function(){var u=URL.createObjectURL(new Blob([source.value],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='my-website.html';a.click();URL.revokeObjectURL(u);};document.getElementById('publish').onclick=function(){var b=this;b.disabled=true;b.textContent='Publishing…';fetch('/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html:source.value})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error||'Publish failed');return d;});}).then(function(d){message.textContent='Published URL: '+location.origin+d.url.replace(location.origin,'');message.innerHTML='Published URL: <a target="_blank" rel="noopener" href="'+d.url+'">'+d.url+'</a>';}).catch(function(e){message.textContent=e.message;}).finally(function(){b.disabled=false;b.textContent='Publish URL';});};
</script></body></html>
