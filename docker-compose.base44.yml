services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5000"
    environment:
      - PORT=5000
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
      - BASE44_PREVIEW_MODE
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec flask run --reload --host 0.0.0.0 --port 5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure
